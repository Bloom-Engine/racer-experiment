[project]
name = "BloomRacer"
entry = "src/main.ts"
bundle_id = "com.skelpo.bloomracer"
display_name = "Bloom Racer"
version = "0.1.0"
build_number = 1
features = ["ios-game-loop"]

[build]
out_dir = "dist"
opt_level = 2

[ios]
bundle_id = "com.skelpo.bloomracer"
category = "public.app-category.games"
orientations = ["landscape"]
device_family = ["iphone", "ipad"]
encryption_exempt = true
# On-device development signing (profile created for this bundle id; see NOTES.md "iOS").
signing_identity = "Apple Development: YOUR NAME (TEAMID)"  # set your own
provisioning_profile = "~/.perry/YOUR_PROFILE.mobileprovision"  # set your own

[macos]
bundle_id = "com.skelpo.bloomracer"
category = "public.app-category.games"
